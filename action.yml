name: jactionlint
description: Lint GitHub Actions workflows and Dependabot configuration with jactionlint, as annotations or code scanning alerts

branding:
  icon: shield
  color: blue

inputs:
  version:
    description: |
      The version of jactionlint to download, as an exact X.Y.Z version. The default is the release the action itself
      was published with, so pinning the action pins jactionlint too.
    required: false
    default: "2.2.0" # x-release-please-version
  executable:
    description: |
      The path of a jactionlint executable to use instead of downloading one, for example one installed with mise or
      built by an earlier step. Then "version" is ignored.
    required: false
    default: ""
  files:
    description: |
      The files to check, separated by whitespace. Without it jactionlint checks the workflow files, the composite
      actions, the Dependabot configuration and the Actions lock file of the repository.
    required: false
    default: ""
  profile:
    description: |
      The rule profile: correctness, default or pedantic. Without it the "profile" of the config file, or default,
      applies.
    required: false
    default: ""
  config-file:
    description: The path of the config file, when it is not .github/jactionlint.yaml.
    required: false
    default: ""
  min-severity:
    description: Hide findings less severe than this level. One of info, warn or error.
    required: false
    default: ""
  strict-exit:
    description: Fail the step for findings of level warn and info too, not only for errors.
    required: false
    default: "false"
  online:
    description: |
      Whether to run the checks which query the GitHub API. "true" runs them, "false" never uses the network, "cache" and
      "strict" are the modes of --online, and empty leaves it to the config file.
    required: false
    default: ""
  token:
    description: The GitHub API token for the online checks. It is not passed to jactionlint when online is "false".
    required: false
    default: ${{ github.token }}
  annotations:
    description: |
      Whether to annotate the files in the pull request with the findings. It has no effect when advanced-security is
      true.
    required: false
    default: "true"
  advanced-security:
    description: |
      Whether to upload the findings to code scanning as SARIF. The job needs the "security-events: write" permission.
      It takes precedence over annotations.
    required: false
    default: "false"
  color:
    description: Whether to colorize the output of the text format.
    required: false
    default: "true"
  args:
    description: |
      Further command line options, separated by whitespace (for example "--ignore=unpinned-images"). They are split
      with the shell word splitting rules, without quote removal.
    required: false
    default: ""
  working-directory:
    description: The directory to run jactionlint in.
    required: false
    default: .

outputs:
  executable:
    description: The path of the jactionlint executable the action used.
    value: ${{ inputs.executable || steps.install.outputs.executable }}
  sarif-file:
    description: The path of the SARIF file, when advanced-security is true.
    value: ${{ steps.run.outputs.sarif-file }}

runs:
  using: composite
  steps:
    - name: Subscription check
      env:
        REPO_PRIVATE: ${{ github.event.repository.private }}
      run: |
        # validate subscription status
        UPSTREAM="jdx/jactionlint"
        ACTION_REPO="${GITHUB_ACTION_REPOSITORY:-}"
        DOCS_URL="https://docs.stepsecurity.io/actions/stepsecurity-maintained-actions"

        echo ""
        echo -e "\033[1;36mStepSecurity Maintained Action\033[0m"
        echo "Secure drop-in replacement for $UPSTREAM"
        if [ "$REPO_PRIVATE" = "false" ]; then
          echo -e "\033[32m✓ Free for public repositories\033[0m"
        fi
        echo -e "\033[36mLearn more:\033[0m $DOCS_URL"
        echo ""

        if [ "$REPO_PRIVATE" != "false" ]; then
          SERVER_URL="${GITHUB_SERVER_URL:-https://github.com}"

          if [ "$SERVER_URL" != "https://github.com" ]; then
            BODY=$(printf '{"action":"%s","ghes_server":"%s"}' "$ACTION_REPO" "$SERVER_URL")
          else
            BODY=$(printf '{"action":"%s"}' "$ACTION_REPO")
          fi

          API_URL="https://agent.api.stepsecurity.io/v1/github/$GITHUB_REPOSITORY/actions/maintained-actions-subscription"

          RESPONSE=$(curl --max-time 3 -s -w "%{http_code}" \
            -X POST \
            -H "Content-Type: application/json" \
            -d "$BODY" \
            "$API_URL" -o /dev/null) && CURL_EXIT_CODE=0 || CURL_EXIT_CODE=$?

          if [ $CURL_EXIT_CODE -ne 0 ]; then
            echo "Timeout or API not reachable. Continuing to next step."
          elif [ "$RESPONSE" = "403" ]; then
            echo -e "::error::\033[1;31mThis action requires a StepSecurity subscription for private repositories.\033[0m"
            echo -e "::error::\033[31mLearn how to enable a subscription: $DOCS_URL\033[0m"
            exit 1
          fi
        fi
      shell: bash
    - name: Install jactionlint
      id: install
      if: ${{ inputs.executable == '' }}
      shell: bash
      run: |
        dir="${RUNNER_TEMP}/jactionlint"
        mkdir -p "${dir}"
        bash "${GITHUB_ACTION_PATH}/scripts/download-jactionlint.bash" "${JACTIONLINT_VERSION}" "${dir}"
      env:
        JACTIONLINT_VERSION: ${{ inputs.version }}

    - name: Run jactionlint
      id: run
      shell: bash
      run: bash "${GITHUB_ACTION_PATH}/scripts/action.bash"
      env:
        JACTIONLINT_EXECUTABLE: ${{ inputs.executable || steps.install.outputs.executable }}
        JACTIONLINT_FILES: ${{ inputs.files }}
        JACTIONLINT_PROFILE: ${{ inputs.profile }}
        JACTIONLINT_CONFIG_FILE: ${{ inputs.config-file }}
        JACTIONLINT_MIN_SEVERITY: ${{ inputs.min-severity }}
        JACTIONLINT_STRICT_EXIT: ${{ inputs.strict-exit }}
        JACTIONLINT_ONLINE: ${{ inputs.online }}
        JACTIONLINT_TOKEN: ${{ inputs.token }}
        JACTIONLINT_ANNOTATIONS: ${{ inputs.annotations }}
        JACTIONLINT_ADVANCED_SECURITY: ${{ inputs.advanced-security }}
        JACTIONLINT_COLOR: ${{ inputs.color }}
        JACTIONLINT_ARGS: ${{ inputs.args }}
        JACTIONLINT_WORKING_DIRECTORY: ${{ inputs.working-directory }}

    # The run step succeeds in SARIF mode so that the findings are uploaded even when there are some. The step after
    # the upload fails the job with the status of jactionlint.
    - name: Upload SARIF file to code scanning
      if: ${{ !cancelled() && inputs.advanced-security == 'true' && steps.run.outputs.sarif-file != '' }}
      uses: github/codeql-action/upload-sarif@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
      with:
        sarif_file: ${{ steps.run.outputs.sarif-file }}
        category: jactionlint

    - name: Fail on findings
      if: ${{ !cancelled() && inputs.advanced-security == 'true' && steps.run.outputs.exit-code != '' && steps.run.outputs.exit-code != '0' }}
      shell: bash
      run: |
        echo "::error title=jactionlint::jactionlint exited with status ${EXIT_CODE}"
        exit "${EXIT_CODE}"
      env:
        EXIT_CODE: ${{ steps.run.outputs.exit-code }}
